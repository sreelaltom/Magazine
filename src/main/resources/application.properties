# Server Port
server.port=8080

# Application Name
spring.application.name=MagazinePortal

# File Upload Max Sizes (for PDF uploads)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# H2 File-based Database Configuration (Persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/magazinedb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Enable H2 Web Console (can be viewed at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Thymeleaf caching disabled for instant UI development updates
spring.thymeleaf.cache=false

# Custom Upload Storage Path
app.upload.dir=./uploads
